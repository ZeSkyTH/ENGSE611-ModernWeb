<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Loop Practice</title>
</head>
<body>
    <button onclick="checkloop()">Run Code</button>
    <div id="output"></div>

    <script>
        function checkloop() {
            let maxNumber = 10; 
            let resultText = "";

            for (let i = 0; i <= maxNumber; i++) {
                if (i % 2 === 0) {
                    resultText += i + " (คู่)\n";
                } else {
                    resultText += i + " (คี่)\n";
                }
            }

            for (let i = 0; i <= maxNumber; i += 2) {
                resultText += "นับทีละ 2: " + i + "\n";
            }

            for (let i = 10; i >= 0; i--) {
                resultText += "ถอยหลัง: " + i + "\n";
            }

            document.getElementById("output").innerText = resultText;
            console.log(resultText);
        }
    </script>
</body>
</html>
