<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Grade Check Switch</title>
</head>
<body>
    <button onclick="checkGrade()">Run Code</button>

    <div id="outputBox"></div>

    <script>
        function checkGrade() {
            let score = Math.floor(Math.random() * 101);
            let grade = "";
            let examResult = "";
            let description = "";

            if (score >= 80) {
                grade = "A";
            } else if (score >= 70) {
                grade = "B";
            } else if (score >= 60) {
                grade = "C";
            } else if (score >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            if (score >= 50) {
                examResult = "ผ่าน";
            } else {
                examResult = "ไม่ผ่าน";
            }

            switch (grade) {
                case "A":
                    description = "ยอดเยี่ยมมาก";
                    break;
                case "B":
                    description = "ดีมาก";
                    break;
                case "C":
                    description = "ผ่านเกณฑ์ระดับดี";
                    break;
                case "D":
                    description = "พอใช้";
                    break;
                case "F":
                    description = "ต้องลงทะเบียนเรียนใหม่";
                    break;
            }

            let displayMessage = "คะแนนที่สุ่มได้: " + score + "\n" +
                                 "เกรด: " + grade + "\n" +
                                 "ผลสอบ: " + examResult + "\n" +
                                 "คำอธิบาย: " + description;

            document.getElementById("outputBox").innerText = displayMessage;
            console.log("คะแนนที่สุ่มได้: " + score);
            console.log("เกรด: " + grade);
            console.log("ผลสอบ: " + examResult);
            console.log("คำอธิบาย: " + description);
        }
    </script>
</body>
</html>
