<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Check</title>
</head>
<body>
    <button onclick="checkGrade()">Run Code</button>
    <div id="output"></div>

    <script>
        function checkGrade() {
            let score = Math.floor(Math.random() * 101); 
            let grade = "";
            let examResult = "";

            if (score >= 80) {
                grade = "A";
            } else if (score >= 70) {
                grade = "B";
            } else if (score >= 60) {
                grade = "C";
            } else if (score >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            if (score >= 50) {
                examResult = "ผ่าน";
            } else {
                examResult = "ไม่ผ่าน";
            }

            let displayMessage = "คะแนนที่สุ่มได้: " + score + "\n" +
                                 "เกรด: " + grade + "\n" +
                                 "ผลสอบ: " + examResult;

            document.getElementById("output").innerText = displayMessage;
            console.log("คะแนนที่สุ่มได้: " + score);
            console.log("เกรด: " + grade);
            console.log("ผลสอบ: " + examResult);
        }
    </script>
</body>
</html>
