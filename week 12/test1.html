<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตัวอย่างฟังก์ชันทั้ง 4 แบบใน JavaScript</title>
  <link rel="Stylesheet" href="test1.css">
</head>
<body>
  <div class="container">
    <h1>ตัวอย่างฟังก์ชันทั้ง 4 แบบใน JavaScript</h1>

    <pre id="code"></pre>

    <button id="runBtn" type="button">Run Code</button>

    <pre id="output"></pre>
  </div>

  <script>
    const codeText = `1) ฟังก์ชันแบบปกติ (ไม่มีพารามิเตอร์)
function sayHi() {
    console.log("Hi");
}

2) ฟังก์ชันแบบ Arrow (ไม่มีพารามิเตอร์)
const sayHiArrow = () => console.log("Hi from Arrow");

3) ฟังก์ชันแบบส่งค่าเข้า (Parameters)
function greet(name) {
    console.log("Hello " + name);
}
greet("Alex");

4) ฟังก์ชันที่ส่งค่ากลับ (Return Value)
function add(a, b) {
    return a + b;
}
console.log(add(5, 7));`;

    document.getElementById("code").textContent = codeText;

    function runDemo() {
      const output = [];

      function sayHi() {
        output.push("Hi");
        console.log("Hi");
      }
      sayHi();

      const sayHiArrow = () => {
        output.push("Hi from Arrow");
        console.log("Hi from Arrow");
      };
      sayHiArrow();

      function greet(name) {
        output.push("Hello " + name);
        console.log("Hello " + name);
      }
      greet("Alex");

      function add(a, b) {
        return a + b;
      }
      let sum = add(5, 7);
      output.push("ผลรวม 5 + 7 = " + sum);
      console.log("ผลรวม:", sum);

      document.getElementById("output").textContent = output.join("\n");
    }

    document.getElementById("runBtn").addEventListener("click", runDemo);
  </script>
</body>
</html>
